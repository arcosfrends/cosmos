<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="cosmos · 소속 플랫폼 데모">
<meta property="og:description" content="흩어진 사람들이 링크로 이어져 하나의 우주가 되는 곳. 비밀번호로 체험해 보세요.">
<meta property="og:image" content="https://arcosfrends.github.io/cosmos/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://arcosfrends.github.io/cosmos/">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="흩어진 사람들이 링크로 이어져 하나의 우주가 되는 곳.">
<title>cosmos · 데모</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');
:root{--color-bg:#f5ead8;--color-surface:#ebddc5;--color-text:#201e1d;--color-accent:#c67139;--color-accent-2:#7a8a5e;--color-divider:color-mix(in srgb,#201e1d 16%,transparent);
--color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;--color-neutral-400:#c0b6a5;--color-neutral-500:#a19786;--color-neutral-600:#82796a;--color-neutral-700:#645c50;--color-neutral-800:#474238;--color-neutral-900:#2e2b25;
--color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-300:#ffc6a5;--color-accent-400:#f6a06b;--color-accent-500:#d67f48;--color-accent-600:#b2622d;--color-accent-700:#8c491a;--color-accent-800:#643312;--color-accent-900:#402310;
--color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;--color-accent-2-400:#aebf92;--color-accent-2-500:#8fa073;--color-accent-2-600:#728157;--color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;--color-accent-2-900:#272e1b;
--font-heading:"Caprasimo",system-ui,sans-serif;--font-heading-weight:400;--font-body:"Figtree",system-ui,sans-serif;
--space-1:4.4px;--space-2:8.8px;--space-3:13.2px;--space-4:17.6px;--space-6:26.4px;--space-8:35.2px;--radius-sm:8px;--radius-md:16px;--radius-lg:28px;
--shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);--shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);--shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent)}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:15px;line-height:1.55;font-weight:400}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);line-height:1.12;letter-spacing:-.015em;margin:0 0 var(--space-2)}
h1{font-size:42px}h2{font-size:32px}h3{font-size:25px}h4{font-size:20px}h5{font-size:16px}h6{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
p{margin:0 0 var(--space-3)}a{color:var(--color-accent);text-underline-offset:3px}img{display:block;max-width:100%}
:focus{outline:none}:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:14px;line-height:1.2;color:var(--color-text);background:transparent;border:1px solid transparent;padding:var(--space-2) calc(var(--space-3)*1.2);border-radius:var(--radius-md)}
.btn svg{display:block}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--color-accent);color:var(--color-bg)}.btn-primary:hover{background:var(--color-accent-600)}.btn-primary:active{background:var(--color-accent-700)}
.btn-secondary{border-color:var(--color-divider)}.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.btn-ghost{color:var(--color-accent);padding-inline:var(--space-1)}.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}.btn-ghost:active{background:color-mix(in srgb,var(--color-accent) 18%,transparent)}
.btn-icon{width:36px;height:36px;padding:0}.btn-block{width:100%;margin-top:var(--space-2)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}.input:focus-visible{border-color:var(--color-accent);outline-offset:0}
textarea.input{min-height:90px;resize:vertical}
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface)}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:calc(var(--radius-md)*.75)}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}
.elev-sm{box-shadow:var(--shadow-sm)}.elev-md{box-shadow:var(--shadow-md)}.elev-lg{box-shadow:var(--shadow-lg)}
.card,.dialog{border-radius:calc(var(--radius-lg)*1.15)}
.btn,.tag,.seg,.input{border-radius:999px}
.input{padding-inline:14px}
</style>
<style>body{margin:0;background:var(--color-neutral-200)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes wfade{from{opacity:0}to{opacity:1}}@keyframes wblink{0%,100%{opacity:1}50%{opacity:.35}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<template id="dc-tpl">

<div style="min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;font-family:var(--font-body);color:var(--color-text)">

<div style="zoom:var(--ps,1);flex:none;width:390px;height:812px;border-radius:48px;background:var(--color-bg);border:8px solid var(--color-neutral-900);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)">
<div style="flex:none;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:13px;font-weight:700;position:relative;z-index:3;color:{{ statusColor }}"><span>9:41</span><span>5G 100%</span></div>

<sc-if value="{{ is.onb }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;z-index:2;inset:0;background:var(--color-bg);display:flex;flex-direction:column;padding:70px 28px 34px;overflow:hidden">
<div style="position:absolute;width:320px;height:320px;border-radius:50%;background:var(--color-accent-200);right:-120px;top:40px"></div>
<div style="position:absolute;width:190px;height:190px;border-radius:50%;background:var(--color-accent-2-200);left:-70px;top:290px"></div>
<div style="position:relative;display:flex;flex-direction:column;flex:1">
<span class="tag tag-accent" style="align-self:flex-start">초대장이 도착했어요</span>
<h1 style="font-size:38px;margin:18px 0 12px">민지가 당신을<br>‘경영 08’에<br>불렀어요</h1>
<p style="font-size:15px;color:var(--color-neutral-800);margin:0 0 28px">이미 아는 얼굴 12명이 기다리고 있어요. 들어오면 동문 소식과 모임이 한 곳에 모여요.</p>
<div style="display:flex;align-items:center;margin-bottom:24px">
<div style="width:56px;height:56px;border-radius:50%;background:var(--color-accent-300);color:var(--color-accent-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:22px;border:3px solid var(--color-bg)">민</div>
<div style="width:56px;height:56px;border-radius:50%;background:var(--color-accent-2-400);color:var(--color-accent-2-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:22px;border:3px solid var(--color-bg);margin-left:-14px">서</div>
<div style="width:56px;height:56px;border-radius:50%;background:var(--color-neutral-300);color:var(--color-neutral-900);display:grid;place-items:center;font-family:var(--font-heading);font-size:22px;border:3px solid var(--color-bg);margin-left:-14px">준</div>
<div style="width:56px;height:56px;border-radius:50%;background:var(--color-text);color:var(--color-bg);display:grid;place-items:center;font-weight:700;font-size:14px;border:3px solid var(--color-bg);margin-left:-14px">+9</div>
</div>
<div class="card" style="background:var(--color-neutral-100);flex-direction:row;align-items:center;gap:14px;padding:16px">
<div style="width:48px;height:48px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:15px">08</div>
<div style="flex:1"><div style="font-weight:700;font-size:15px">연세 경영 08 동문회</div><div style="font-size:12px;color:var(--color-neutral-700)">멤버 128명 · 이번 달 모임 2개</div></div>
</div>
<div style="flex:1"></div>
<button class="btn btn-primary" onClick="{{ accept }}" style="width:100%;padding:16px;font-size:16px">초대 수락하고 들어가기</button>
<button class="btn btn-ghost" onClick="{{ acceptMore }}" style="width:100%;margin-top:8px;color:var(--color-accent-700)">다른 소속도 함께 연결할래요</button>
</div>
</div>
</sc-if>

<sc-if value="{{ hasBack }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 10px">
<button onClick="{{ back }}" style="width:38px;height:38px;border-radius:50%;border:none;background:var(--color-neutral-100);display:grid;place-items:center;cursor:pointer;color:var(--color-text)" style-hover="background:var(--color-neutral-300)">{{ i.left }}</button>
<div style="font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ backTitle }}</div>
</div>
</sc-if>

<div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;position:relative">

<!-- HOME -->
<sc-if value="{{ is.home }}" hint-placeholder-val="{{ false }}">
<div style="padding-bottom:24px">
<div style="display:flex;align-items:center;gap:8px;padding:8px 20px 12px"><div style="font-family:var(--font-heading);font-size:24px;flex:1">우리끼리</div><button class="btn btn-icon btn-secondary" onClick="{{ goFind }}">{{ i.search }}</button><button class="btn btn-icon btn-secondary" onClick="{{ openPrivacy }}" aria-label="공개 범위 설정">{{ i.shield }}</button><button class="btn btn-icon btn-secondary" onClick="{{ bell }}">{{ i.bell }}</button></div>
<div onClick="{{ openCard }}" style="margin:0 20px;padding:18px;border-radius:28px;background:var(--color-accent);color:var(--color-bg);position:relative;overflow:hidden;cursor:pointer">
<div style="position:absolute;width:140px;height:140px;border-radius:50%;background:var(--color-accent-400);right:-40px;top:-50px"></div>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;letter-spacing:.1em;opacity:.9">MY MEMBERSHIP · GOLD</span><div style="width:44px;height:44px;border-radius:50%;background:{{ me.bg }};color:{{ me.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:17px;border:2px solid var(--color-bg);overflow:hidden">{{ me.i }}</div></div>
<div style="position:relative;font-family:var(--font-heading);font-size:24px;margin:6px 0 2px">정우진</div>
<div style="position:relative;display:flex;justify-content:space-between;font-size:12px"><span>No. 0412 · 소속 {{ groupCount }}곳</span><span style="font-weight:700">카드 보기 ›</span></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 10px"><div style="font-family:var(--font-heading);font-size:18px">내 소속 지도 · {{ groupCount }}곳</div><span onClick="{{ goGroups }}" style="font-size:12px;color:var(--color-accent-700);font-weight:600;cursor:pointer">전체 ›</span></div>
<div style="display:flex;gap:14px;padding:4px 20px;overflow-x:auto;scrollbar-width:none">
<sc-for list="{{ groupList }}" as="g" hint-placeholder-count="4">
<div onClick="{{ g.open }}" style="display:flex;flex-direction:column;align-items:center;gap:6px;width:112px;flex:none;cursor:pointer;padding:14px 8px 12px;border-radius:26px;background:var(--color-neutral-100)">
<div style="width:58px;height:58px;border-radius:50%;background:{{ g.bg }};color:{{ g.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:15px;box-shadow:0 0 0 2px var(--color-bg),0 0 0 4px {{ g.ring }}">{{ g.short }}</div>
<div style="font-size:12px;font-weight:700;white-space:nowrap">{{ g.label }}</div><div style="font-size:10px;color:var(--color-neutral-700);white-space:nowrap">아는 사람 {{ g.known }}명</div>
</div>
</sc-for>
</div>
<button onClick="{{ connect }}" style="display:flex;justify-content:space-between;align-items:center;width:calc(100% - 40px);margin:12px 20px 0;padding:12px 16px;border-radius:999px;border:1.5px dashed var(--color-accent-400);background:none;color:var(--color-accent-800);font:600 13px var(--font-body);cursor:pointer"><span>끊어진 소속 찾기 · 학교, 직장, 동네</span><span>+ 추가</span></button>
<div onClick="{{ openWeb }}" role="button" tabindex="0" style="margin:14px 20px 0;border-radius:28px;overflow:hidden;background:#241B14;color:#F6EBD9;cursor:pointer;display:flex;align-items:center">
<div style="width:120px;height:96px;flex:none">{{ webTeaser.art }}</div>
<div style="flex:1;padding:0 16px 0 4px;line-height:1.35"><div style="font-family:var(--font-heading);font-size:17px">내 연결망</div><div style="font-size:11.5px;opacity:.82;margin-top:2px">{{ webTeaser.sub }}</div><div style="font-size:11px;font-weight:700;color:#F2C879;margin-top:6px">거미줄 따라가 보기 ›</div></div>
</div>
<div onClick="{{ nextEvent.open }}" style="margin:16px 20px 0;padding:14px 16px;border-radius:24px;background:var(--color-accent-2-300);color:var(--color-accent-2-900);display:flex;align-items:center;gap:14px;cursor:pointer">
<div style="font-family:var(--font-heading);font-size:34px;line-height:1">{{ nextEvent.d }}</div>
<div style="flex:1;line-height:1.3"><div style="font-size:11px;font-weight:600">다가오는 모임 · {{ nextEvent.m }} {{ nextEvent.dow }} {{ nextEvent.time }}</div><div style="font-weight:700;font-size:14px">{{ nextEvent.title }}</div></div>
<span style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--color-bg);color:var(--color-text)">{{ nextEvent.status }}</span>
</div>
<div style="padding:18px 20px 8px;font-family:var(--font-heading);font-size:18px">소식</div>
<div style="padding:0 20px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{ homeFeed }}" as="f" hint-placeholder-count="3">
<div class="card" style="background:var(--color-neutral-100);padding:16px;gap:10px">
<div style="display:flex;align-items:center;gap:10px"><div onClick="{{ f.openWho }}" style="width:34px;height:34px;border-radius:50%;background:{{ f.bg }};color:{{ f.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:14px;cursor:pointer">{{ f.i }}</div><div style="flex:1;line-height:1.25"><div style="font-weight:700;font-size:14px">{{ f.who }}</div><div onClick="{{ f.openGroup }}" style="font-size:11px;color:var(--color-neutral-700);cursor:pointer">{{ f.group }} · {{ f.time }}</div></div></div>
<div style="font-size:14px;line-height:1.5">{{ f.text }}</div>
<sc-if value="{{ f.img }}" hint-placeholder-val="{{ false }}"><div style="height:150px;border-radius:20px;overflow:hidden">{{ f.photo }}</div></sc-if>
<div style="display:flex;gap:16px;font-size:12px"><button onClick="{{ f.like }}" style="display:flex;gap:5px;align-items:center;border:none;background:none;padding:0;cursor:pointer;font:600 12px var(--font-body);color:{{ f.likeC }}">{{ f.heart }} {{ f.likes }}</button><span style="display:flex;gap:5px;align-items:center;color:var(--color-neutral-700)">{{ i.msgS }} {{ f.cm }}</span></div>
</div>
</sc-for>
</div>
<div onClick="{{ goCard }}" style="margin:14px 20px 0;padding:11px 16px;border-radius:999px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);font-size:12px;display:flex;justify-content:space-between;cursor:pointer"><span>이번 주 회원 혜택 3개</span><span>›</span></div>
</div>
</sc-if>

<!-- GROUPS ROOT -->
<sc-if value="{{ is.groups }}" hint-placeholder-val="{{ false }}">
<div style="padding:8px 20px 24px">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><h3 style="margin:0">내 소속</h3><button class="btn btn-ghost" onClick="{{ openStyle }}" style="padding:7px 10px;font-size:12px;margin-left:auto;margin-right:6px">썸네일 꾸미기</button><button class="btn btn-secondary" onClick="{{ connect }}" style="padding:7px 14px;font-size:13px">+ 소속 연결</button></div>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{ groupList }}" as="g" hint-placeholder-count="4">
<div onClick="{{ g.open }}" style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:28px;background:var(--color-neutral-100);cursor:pointer" style-hover="background:var(--color-neutral-300)">
<div style="width:52px;height:52px;flex:none;border-radius:50%;background:{{ g.bg }};color:{{ g.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:15px">{{ g.short }}</div>
<div style="flex:1;line-height:1.3"><div style="font-weight:700;font-size:15px">{{ g.name }}</div><div style="font-size:12px;color:var(--color-neutral-700)">멤버 {{ g.members }} · 아는 사람 {{ g.known }}명</div></div>
<span style="font-size:11px;font-weight:700;color:var(--color-accent-700)">{{ g.newTxt }}</span>
</div>
</sc-for>
</div>
<div style="font-family:var(--font-heading);font-size:18px;margin:24px 0 10px">이번 달 모임</div>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{ eventList }}" as="e" hint-placeholder-count="4">
<div onClick="{{ e.open }}" style="display:flex;gap:14px;align-items:center;padding:12px;border-radius:24px;background:var(--color-neutral-100);cursor:pointer" style-hover="background:var(--color-neutral-300)">
<div style="width:54px;height:54px;flex:none;border-radius:50%;background:{{ e.bg }};color:{{ e.fg }};display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;position:relative;overflow:hidden"><div style="position:absolute;inset:0">{{ e.thumb }}</div><span style="position:relative;font-family:var(--font-heading);font-size:20px;color:{{ e.tc }};text-shadow:{{ e.ts }}">{{ e.d }}</span><span style="position:relative;font-size:10px;color:{{ e.tc }};text-shadow:{{ e.ts }}">{{ e.dow }}</span></div>
<div style="flex:1;line-height:1.3"><div style="font-weight:700;font-size:14px">{{ e.title }}</div><div style="font-size:12px;color:var(--color-neutral-700)">{{ e.where }} · {{ e.time }}</div><div style="font-size:11px;color:var(--color-accent-700);font-weight:600">아는 사람 {{ e.knownN }}명</div></div>
<span style="font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:{{ e.stBg }};color:{{ e.stFg }}">{{ e.status }}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<!-- GROUP DETAIL -->
<sc-if value="{{ is.group }}" hint-placeholder-val="{{ false }}">
<div style="padding-bottom:90px">
<div style="height:130px;margin:0 16px;border-radius:28px;overflow:hidden">{{ grp.cover }}</div>
<div style="padding:0 24px;margin-top:-30px;position:relative">
<div style="width:62px;height:62px;border-radius:50%;background:{{ grp.bg }};color:{{ grp.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:18px;border:4px solid var(--color-bg)">{{ grp.short }}</div>
<h3 style="margin:10px 0 2px">{{ grp.name }}</h3>
<div style="font-size:12px;color:var(--color-neutral-700)">멤버 {{ grp.members }} · 아는 사람 {{ grp.known }}명 · {{ grp.region }}</div>
</div>
<div style="display:flex;gap:6px;padding:16px 20px 12px">

<sc-if value="{{ is.card }}" hint-placeholder-val="{{ false }}">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><h3 style="margin:0">멤버십</h3><button class="btn btn-ghost" onClick="{{ openStyle }}" style="padding:7px 10px;font-size:12px">썸네일 꾸미기</button></div>
<div onClick="{{ openCard }}" style="height:200px;border-radius:32px;background:var(--color-accent);color:var(--color-bg);position:relative;overflow:hidden;padding:20px;display:flex;flex-direction:column;box-shadow:var(--shadow-md);cursor:pointer">
<div style="position:absolute;width:200px;height:200px;border-radius:50%;background:var(--color-accent-400);right:-60px;top:-70px"></div>
<div style="position:absolute;width:110px;height:110px;border-radius:50%;background:var(--color-accent-600);right:40px;bottom:-50px"></div>
<div style="position:relative;display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-size:18px">우리끼리</span><div style="width:46px;height:46px;border-radius:50%;background:{{ me.bg }};color:{{ me.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:17px;border:2px solid var(--color-bg);overflow:hidden">{{ me.i }}</div></div>
<div style="flex:1"></div>
<div style="position:relative;font-family:var(--font-heading);font-size:28px">정우진</div>
<div style="position:relative;display:flex;justify-content:space-between;font-size:12px"><span>No. 0412 · 탭해서 QR</span><span style="font-weight:700;letter-spacing:.1em">GOLD</span></div>
</div>
<div style="margin-top:14px;padding:14px 18px;border-radius:24px;background:var(--color-neutral-100)">
<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px"><span><b>플래티넘</b>까지 모임 {{ tierLeft }}회</span><span style="color:var(--color-neutral-700)">{{ tierNow }} / 10</span></div>
<div style="height:10px;border-radius:10px;background:var(--color-neutral-300)"><div style="width:{{ tierPct }};height:100%;border-radius:10px;background:var(--color-accent-2)"></div></div>
</div>
<div style="padding:20px 0 10px;font-family:var(--font-heading);font-size:18px">회원 혜택</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<sc-for list="{{ perkList }}" as="b" hint-placeholder-count="4">
<div onClick="{{ b.open }}" style="padding:16px;border-radius:24px;background:{{ b.bg }};color:{{ b.fg }};display:flex;flex-direction:column;gap:14px;cursor:pointer">
<div style="width:36px;height:36px;border-radius:50%;background:var(--color-bg);display:grid;place-items:center;color:var(--color-text)">{{ b.ic }}</div>
<div style="line-height:1.3"><div style="font-weight:700;font-size:14px">{{ b.t }}</div><div style="font-size:11px">{{ b.s }}</div></div>
</div>
</sc-for>
</div>
</div>
</sc-if>

<!-- PRIVACY -->
<sc-if value="{{ is.privacy }}" hint-placeholder-val="{{ false }}">
<div style="padding:0 20px 32px">
<h3 style="margin:0 0 4px">내 공개 범위</h3>
<p style="font-size:13px;color:var(--color-neutral-700);margin:0 0 14px;line-height:1.5">연결은 보이게, 프로필은 내가 허락할 때만. 팔로우나 맞팔은 권한이 아니에요.</p>
<div style="padding:16px;border-radius:28px;background:var(--color-neutral-100)">
<div style="display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--color-bg)"><sc-for list="{{ pv.viewSeg }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" aria-pressed="{{ c.on }}" style="flex:1;padding:8px 2px;border-radius:999px;border:none;cursor:pointer;font:600 11.5px var(--font-body);background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div>
<div style="font-size:11px;color:var(--color-neutral-700);margin:12px 0 10px">{{ pv.prev.lvlTxt }}</div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div style="width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none">{{ pv.prev.photo }}</div><div style="font-family:var(--font-heading);font-size:20px">{{ pv.prev.nameBig }}</div></div>
<sc-for list="{{ pv.prev.rows }}" as="r" hint-placeholder-count="4"><div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--color-divider);font-size:12.5px"><span style="color:var(--color-neutral-700);flex:none;width:68px">{{ r.k }}</span><span style="flex:1;text-align:right;font-weight:600;line-height:1.35">{{ r.v }}<sc-if value="{{ r.lock }}" hint-placeholder-val="{{ false }}"><span style="display:block;font-size:10.5px;font-weight:400;color:var(--color-neutral-600)">{{ r.why }}</span></sc-if></span></div></sc-for>
<div style="padding:8px 0 0;border-top:1px solid var(--color-divider);font-size:11.5px;color:var(--color-accent-700);font-weight:600">{{ pv.prev.trace }}</div>
</div>
<div style="font-size:13px;font-weight:700;margin:22px 0 4px">연결망에서</div>
<div style="display:flex;padding:3px;border-radius:999px;background:var(--color-neutral-100)"><sc-for list="{{ pv.webSeg }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" aria-pressed="{{ c.on }}" style="flex:1;padding:8px 0;border-radius:999px;border:none;cursor:pointer;font:600 13px var(--font-body);background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div>
<div style="font-size:11.5px;line-height:1.55;color:var(--color-neutral-700);margin-top:8px">{{ pv.webNote }}</div>
<div style="font-size:13px;font-weight:700;margin:22px 0 6px">프로필 항목별로 누가 볼 수 있나요</div>
<sc-for list="{{ pv.fields }}" as="f" hint-placeholder-count="5"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--color-divider)"><span style="font-size:13px;font-weight:600;flex:none;width:76px">{{ f.l }}</span><div style="display:flex;gap:4px"><sc-for list="{{ f.chips }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" aria-pressed="{{ c.on }}" style="padding:6px 9px;border-radius:999px;cursor:pointer;font:600 11px var(--font-body);border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div></div></sc-for>
<div style="display:flex;align-items:center;justify-content:space-between;margin:22px 0 4px"><div style="font-size:13px;font-weight:700">소개 요청 받기</div><button onClick="{{ pv.jumpOn.go }}" aria-label="소개 요청 받기" style="width:46px;height:28px;border-radius:999px;border:none;background:{{ pv.jumpOn.sw }};position:relative;cursor:pointer;padding:0"><span style="position:absolute;top:3px;left:{{ pv.jumpOn.x }};width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s"></span></button></div>
<div style="font-size:11.5px;line-height:1.55;color:var(--color-neutral-700)">연결자를 거친 요청만 받아요. 연결자와 내가 모두 허용해야 열려요.</div>
<sc-if value="{{ pv.jumpDetail }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px"><span style="font-size:12.5px">하루 받을 요청</span><div style="display:flex;gap:4px"><sc-for list="{{ pv.limitChips }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" aria-pressed="{{ c.on }}" style="padding:6px 11px;border-radius:999px;cursor:pointer;font:600 11.5px var(--font-body);border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px"><span style="font-size:12.5px">허용 후 열려 있는 기간</span><div style="display:flex;gap:4px"><sc-for list="{{ pv.expireChips }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" aria-pressed="{{ c.on }}" style="padding:6px 11px;border-radius:999px;cursor:pointer;font:600 11.5px var(--font-body);border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div></div>
</sc-if>
<div style="margin-top:20px;padding:12px 14px;border-radius:20px;border:1px dashed var(--color-divider);font-size:11.5px;line-height:1.6;color:var(--color-neutral-700)"><sc-for list="{{ pv.safety }}" as="t" hint-placeholder-count="3"><div>· {{ t }}</div></sc-for></div>
<button class="btn btn-primary" onClick="{{ pv.save }}" style="width:100%;padding:16px;font-size:16px;margin-top:18px">{{ pv.saveTxt }}</button>
<button class="btn btn-ghost" onClick="{{ pv.reset }}" style="width:100%;margin-top:6px;font-size:13px">기본값으로 되돌리기</button>
</div>
</sc-if>

<!-- WEB -->
<sc-if value="{{ is.web }}" hint-placeholder-val="{{ false }}">
<div style="padding-bottom:24px">
<div style="position:relative;height:400px;margin:0 8px;border-radius:30px;overflow:hidden;background:#17120E">
<div style="position:absolute;inset:0">{{ web.canvas }}</div>
<div style="position:absolute;left:14px;top:12px;padding:5px 11px;border-radius:999px;background:rgba(246,235,217,.14);color:#F6EBD9;font-size:11px;font-weight:700;pointer-events:none">{{ web.badge }}</div>
<button onClick="{{ web.togglePriv }}" style="position:absolute;right:12px;top:10px;padding:5px 11px;border-radius:999px;border:1px solid rgba(246,235,217,.3);background:rgba(246,235,217,.08);color:#F6EBD9;font:600 11px var(--font-body);cursor:pointer">{{ web.privTxt }}</button>
<div style="position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:rgba(246,235,217,.7);pointer-events:none">{{ web.hint }}</div>
</div>
<div style="margin:12px 20px 0;padding:14px 16px;border-radius:26px;background:var(--color-neutral-100)">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:46px;height:46px;flex:none;border-radius:{{ web.info.rad }};overflow:hidden">{{ web.info.i }}</div>
<div style="flex:1;min-width:0;line-height:1.35"><div style="font-weight:700;font-size:15px">{{ web.info.title }}</div><div style="font-size:12px;color:var(--color-neutral-700)">{{ web.info.sub }}</div></div>
<span class="tag tag-accent">{{ web.info.pill }}</span>
</div>
<div style="margin-top:10px;font-size:12.5px;line-height:1.5;font-weight:600">{{ web.info.via }}</div>
<div style="margin-top:6px;font-size:11px;line-height:1.5;color:var(--color-neutral-700)">{{ web.info.pathTxt }}</div>
<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
<sc-if value="{{ web.info.canDemo }}" hint-placeholder-val="{{ true }}"><button class="btn btn-primary" onClick="{{ web.info.demo }}" style="padding:10px 16px;font-size:13px">자동 탐색 데모</button></sc-if>
<sc-if value="{{ web.info.canReplay }}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{ web.info.replay }}" style="padding:10px 16px;font-size:13px">처음부터 따라가기</button></sc-if>
<sc-if value="{{ web.info.canProfile }}" hint-placeholder-val="{{ false }}"><button class="btn btn-secondary" onClick="{{ web.info.profile }}" style="padding:10px 16px;font-size:13px">프로필 보기</button></sc-if>
<sc-if value="{{ web.info.canJump }}" hint-placeholder-val="{{ false }}"><button class="btn btn-primary" onClick="{{ web.info.jump }}" style="padding:10px 16px;font-size:13px">소개 요청하기</button></sc-if>
<sc-if value="{{ web.info.hasWait }}" hint-placeholder-val="{{ false }}"><span class="tag tag-accent" style="padding:9px 14px;font-size:12px;animation:wblink 1.2s infinite">{{ web.info.jumpWait }}</span></sc-if>
<sc-if value="{{ web.info.jumpBlocked }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;line-height:1.5;color:var(--color-neutral-700)">3단계부터는 소개를 요청할 수 없어요. 더 가까운 연결을 먼저 거쳐 주세요.</div></sc-if>
</div>
</div>
<div style="padding:16px 20px 6px;font-size:12px;font-weight:700">지나온 길</div>
<div id="wtrail" style="display:flex;align-items:center;overflow-x:auto;padding:2px 20px 8px;scrollbar-width:none">
<sc-for list="{{ web.trail }}" as="b" hint-placeholder-count="3">
<sc-if value="{{ b.link }}" hint-placeholder-val="{{ false }}"><div style="width:16px;height:2px;flex:none;background:var(--color-accent-400)"></div></sc-if>
<button onClick="{{ b.go }}" style="flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;padding:8px 8px 6px;border-radius:16px;border:2px solid {{ b.bd }};background:{{ b.bg }};cursor:pointer;color:var(--color-text);font:inherit">
<div style="width:30px;height:30px;border-radius:{{ b.rad }};overflow:hidden">{{ b.i }}</div>
<span style="font-size:11px;font-weight:700;white-space:nowrap">{{ b.label }}</span>
<span style="font-size:9px;color:var(--color-neutral-700);white-space:nowrap">{{ b.tag }}</span>
<span style="font:9px ui-monospace,Menlo,monospace;color:var(--color-neutral-600)">{{ b.hash }}</span>
</button>
</sc-for>
</div>
<div style="margin:6px 20px 0;padding:12px 14px;border-radius:20px;border:1px dashed var(--color-divider);font-size:11.5px;line-height:1.6;color:var(--color-neutral-700)">1단계는 이름, 2단계는 성만, 3단계부터는 ‘누군가’로 보여요. ‘엄격’ 모드는 2단계부터 가립니다. 직업·연락처는 같은 소속이 되기 전엔 열리지 않아요. 이 지도는 예시 데이터예요.</div>
</div>
</sc-if>

<!-- ADD -->
<sc-if value="{{ is.add }}" hint-placeholder-val="{{ false }}">
<div style="padding:4px 20px 28px">
<div style="display:flex;gap:6px;margin-bottom:14px"><sc-for list="{{ ad.dots }}" as="d" hint-placeholder-count="3"><div style="flex:1;height:6px;border-radius:6px;background:{{ d.bg }}"></div></sc-for></div>
<div style="font-size:12px;color:var(--color-neutral-700);margin-bottom:8px">{{ ad.stepTxt }}</div>
<sc-if value="{{ ad.s1 }}" hint-placeholder-val="{{ true }}">
<h3 style="margin:0 0 6px">어디에 속했었나요?</h3>
<p style="font-size:13px;color:var(--color-neutral-700);margin:0 0 14px">끊어진 소속을 다시 찾아드려요. 종류를 고르면 모임이 나와요.</p>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><sc-for list="{{ ad.kinds }}" as="c" hint-placeholder-count="4"><button onClick="{{ c.go }}" style="padding:8px 14px;border-radius:999px;cursor:pointer;font:600 13px var(--font-body);border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ ad.cands }}" as="c" hint-placeholder-count="2">
<button onClick="{{ c.pick }}" style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:24px;background:var(--color-neutral-100);border:2px solid {{ c.bd }};cursor:pointer;text-align:left;font-family:var(--font-body);color:var(--color-text)">
<div style="width:48px;height:48px;flex:none;border-radius:50%;background:{{ c.bg }};color:{{ c.fg }};display:grid;place-items:center;font-family:var(--font-heading);font-size:14px">{{ c.short }}</div>
<div style="flex:1;line-height:1.3"><div style="font-weight:700;font-size:14px">{{ c.name }}</div><div style="font-size:12px;color:var(--color-neutral-700)">멤버 {{ c.members }} · 아는 사람 {{ c.known }}명 · {{ c.region }}</div></div>
</button>
</sc-for>
</div>
<button class="btn btn-primary" onClick="{{ ad.next1 }}" disabled="{{ ad.noPick }}" style="width:100%;padding:16px;font-size:16px;margin-top:18px">다음: 실명·기수 확인</button>
</sc-if>
<sc-if value="{{ ad.s2 }}" hint-placeholder-val="{{ false }}">
<h3 style="margin:0 0 6px">{{ ad.pickName }}</h3>
<p style="font-size:13px;color:var(--color-neutral-700);margin:0 0 14px">같은 사람만 모이도록 소속마다 한 번 확인해요. 사칭을 막는 절차예요.</p>
<div style="padding:14px 16px;border-radius:24px;background:var(--color-neutral-100);margin-bottom:16px"><div style="font-size:11px;color:var(--color-neutral-700)">실명</div><div style="font-weight:700;font-size:16px">정우진</div></div>
<div style="font-size:12px;font-weight:600;margin-bottom:8px">{{ ad.cohortLabel }}</div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{ ad.cohorts }}" as="c" hint-placeholder-count="3"><button onClick="{{ c.go }}" style="padding:8px 14px;border-radius:999px;cursor:pointer;font:600 13px var(--font-body);border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }}">{{ c.l }}</button></sc-for></div>
<button class="btn btn-primary" onClick="{{ ad.verify }}" disabled="{{ ad.verifying }}" style="width:100%;padding:16px;font-size:16px;margin-top:22px">{{ ad.verifyTxt }}</button>
</sc-if>
<sc-if value="{{ ad.s3 }}" hint-placeholder-val="{{ false }}">
<h3 style="margin:0 0 6px">무엇을 보여줄까요?</h3>
<p style="font-size:13px;color:var(--color-neutral-700);margin:0 0 14px">소속 사이의 정보 공유는 내가 켠 것만 연결돼요.</p>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ ad.toggles }}" as="t" hint-placeholder-count="3">
<button onClick="{{ t.go }}" aria-pressed="{{ t.on }}" style="display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:24px;background:var(--color-neutral-100);border:none;cursor:pointer;text-align:left;font-family:var(--font-body);color:var(--color-text)">
<div style="flex:1;line-height:1.3"><div style="font-weight:700;font-size:14px">{{ t.l }}</div><div style="font-size:12px;color:var(--color-neutral-700)">{{ t.d }}</div></div>
<div style="width:46px;height:28px;border-radius:28px;background:{{ t.sw }};position:relative;flex:none"><div style="position:absolute;top:3px;left:{{ t.x }};width:22px;height:22px;border-radius:50%;background:var(--color-bg)"></div></div>
</button>
</sc-for>
</div>
<button class="btn btn-primary" onClick="{{ ad.finish }}" style="width:100%;padding:16px;font-size:16px;margin-top:22px">{{ ad.finishTxt }}</button>
</sc-if>
</div>
</sc-if>

<!-- PERK -->
<sc-if value="{{ is.perk }}" hint-placeholder-val="{{ false }}">
<div style="padding:4px 20px 24px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:13px;color:var(--color-neutral-700);margin-bottom:4px">{{ perkDesc }}</div>
<sc-for list="{{ buys }}" as="b" hint-placeholder-count="0">
<div style="border-radius:28px;background:var(--color-accent-2-300);color:var(--color-accent-2-900);padding:18px">
<div style="display:flex;gap:14px;align-items:center">
<div style="width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden">{{ b.art }}</div>
<div style="line-height:1.3;flex:1"><div style="font-size:11px;font-weight:700">{{ b.s }}</div><div style="font-family:var(--font-heading);font-size:17px;margin:2px 0">{{ b.t }}</div><div style="font-size:12px">{{ b.now }}/{{ b.goal }}명 참여</div></div>
</div>
<div style="height:8px;border-radius:8px;background:var(--color-accent-2-200);margin:14px 0 12px"><div style="width:{{ b.pct }};height:100%;border-radius:8px;background:var(--color-accent-2-700)"></div></div>
<button class="btn" onClick="{{ b.join }}" style="width:100%;padding:12px;background:{{ b.bBg }};color:{{ b.bFg }}">{{ b.btn }}</button>
</div>
</sc-for>
<sc-for list="{{ deals }}" as="d" hint-placeholder-count="3">
<div onClick="{{ d.use }}" style="display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:24px;background:var(--color-neutral-100);cursor:pointer" style-hover="background:var(--color-neutral-300)">
<div style="width:46px;height:46px;flex:none;border-radius:50%;background:var(--color-accent-200);color:var(--color-accent-800);display:grid;place-items:center;font-family:var(--font-heading);font-size:13px">{{ d.pct }}</div>
<div style="flex:1;line-height:1.3"><div style="font-weight:700;font-size:14px">{{ d.t }}</div><div style="font-size:12px;color:var(--color-neutral-700)">{{ d.s }}</div></div>
<span style="font-size:12px;font-weight:700;color:var(--color-accent-700)">{{ d.cta }}</span>
</div>
</sc-for>
</div>
</sc-if>

</div>

<sc-if value="{{ is.chat }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;display:flex;gap:8px;padding:10px 16px 24px;align-items:center">
<div style="flex:1;display:flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--color-neutral-100)"><input value="{{ chatDraft }}" onChange="{{ onChatDraft }}" onKeyDown="{{ onChatKey }}" placeholder="메시지 보내기" style="flex:1;border:none;background:transparent;padding:12px 0;font:14px var(--font-body);color:var(--color-text);outline:none"></div>

      `<rect width="200" height="100" fill="url(#${u}s)"/><circle cx="52" cy="26" r="10" fill="#FFF7E6"/>` +
      '<polygon points="0,84 52,44 100,84" fill="#7A9B86"/><polygon points="64,88 118,22 190,88" fill="#55775E"/><polygon points="106,38 118,22 130,40 118,35" fill="#fff"/>' +
      '<rect y="84" width="200" height="16" fill="#3F5F45"/><polygon points="20,86 28,66 36,86" fill="#2F4B36"/><polygon points="150,90 160,68 170,90" fill="#2F4B36"/><polygon points="174,90 182,72 190,90" fill="#2F4B36"/>',
    cafe: () =>
      '<rect width="200" height="100" fill="#E9C9A0"/><rect x="118" y="12" width="60" height="54" fill="#BFDDF0" stroke="#8A5A3B" stroke-width="3"/><path d="M148 12 V66 M118 39 H178" stroke="#8A5A3B" stroke-width="2"/><circle cx="160" cy="28" r="6" fill="#FFF3D9"/>' +
      '<rect y="74" width="200" height="26" fill="#8A5A3B"/><rect x="72" y="52" width="26" height="22" rx="6" fill="#FBF3E4"/><path d="M98 57 Q108 58 106 66 Q104 70 98 69" stroke="#FBF3E4" stroke-width="4" fill="none"/><ellipse cx="85" cy="53" rx="12" ry="3" fill="#6B3A2B"/>' +
      '<path d="M80 46 Q76 40 80 34 M88 46 Q92 38 88 30" stroke="#fff" stroke-width="2" fill="none" opacity=".75" stroke-linecap="round"/>' +
      '<rect x="22" y="58" width="16" height="16" rx="3" fill="#B9654A"/><path d="M30 58 Q18 46 24 36 M30 58 Q42 46 38 34 M30 58 V32" stroke="#4E7A55" stroke-width="3" fill="none" stroke-linecap="round"/>'
  };

  const sceneArt = (key) => svgEl('0 0 200 100', (SCN[key] || SCN.campus)(nid()));

  const productArt = (id) => {
    const u = nid();
    const clip = `<defs><clipPath id="${u}c"><circle cx="50" cy="50" r="50"/></clipPath></defs>`;
    if (id === 'b1') return svgEl('0 0 100 100', clip + `<g clip-path="url(#${u}c)"><rect width="100" height="100" fill="#F3D9C4"/><rect x="42" y="30" width="16" height="52" rx="6" fill="#5B1F2E"/><rect x="46" y="12" width="8" height="22" rx="2" fill="#5B1F2E"/><rect x="45" y="12" width="10" height="6" fill="#C9A14A"/><rect x="44" y="52" width="12" height="16" fill="#F7ECD9"/><rect x="45" y="34" width="2" height="40" fill="#fff" opacity=".25"/><ellipse cx="50" cy="86" rx="22" ry="4" fill="#000" opacity=".12"/></g>`);
    return svgEl('0 0 100 100', clip + `<g clip-path="url(#${u}c)"><rect width="100" height="100" fill="#FBE7B5"/><circle cx="38" cy="58" r="20" fill="#F0922B"/><circle cx="64" cy="50" r="20" fill="#F7A63F"/><circle cx="52" cy="74" r="17" fill="#E8821F"/><path d="M60 30 Q74 24 76 38 Q64 40 60 30Z" fill="#4E8A55"/><circle cx="32" cy="52" r="4" fill="#fff" opacity=".35"/></g>`);
  };

  const personInner = (seed, mode) => {
    const h = hash(seed), u = nid();
    const sk = SK[h % 5], hr = HR[(h >> 3) % 6], sh = SH[(h >> 5) % 6], bp = BP[(h >> 7) % 6], style = (h >> 9) % 3;
    if (mode === 'icon') return `<rect width="100" height="100" fill="${DK[(h >> 7) % 6]}"/>${iconSvg('user', '#fff', 48, 26, 26, 1)}`;
    const hairBack = style === 1 ? `<ellipse cx="50" cy="46" rx="21" ry="25" fill="${hr}"/>` : '';
    const hairTop = style === 2
      ? `<path d="M31 42 Q30 20 50 20 Q70 20 69 42 Q64 28 50 28 Q36 28 31 42Z" fill="${hr}"/><circle cx="50" cy="18" r="6" fill="${hr}"/>`
      : `<path d="M32 43 Q31 21 50 21 Q69 21 68 43 Q62 31 50 31 Q38 31 32 43Z" fill="${hr}"/>`;
    const face = mode === 'avatar'
      ? '<circle cx="43" cy="45" r="2" fill="#2B2118"/><circle cx="57" cy="45" r="2" fill="#2B2118"/><path d="M44 53 Q50 58 56 53" stroke="#8A4B3A" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="38" cy="51" r="3" fill="#F29A8E" opacity=".45"/><circle cx="62" cy="51" r="3" fill="#F29A8E" opacity=".45"/>'
      : '';
    const bg = mode === 'avatar'
      ? `<rect width="100" height="100" fill="${bp[0]}"/>`
      : `<defs><linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bp[0]}"/><stop offset="1" stop-color="${bp[1]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#${u}g)"/><circle cx="20" cy="22" r="14" fill="#fff" opacity=".25"/><circle cx="82" cy="30" r="9" fill="#fff" opacity=".2"/><circle cx="74" cy="80" r="16" fill="#fff" opacity=".15"/>`;
    return `<defs><clipPath id="${u}c"><circle cx="50" cy="50" r="50"/></clipPath></defs><g clip-path="url(#${u}c)">${bg}${hairBack}<path d="M12 100 Q14 72 50 70 Q86 72 88 100Z" fill="${sh}"/><rect x="44" y="58" width="12" height="14" rx="5" fill="${sk}"/><ellipse cx="50" cy="44" rx="17" ry="19" fill="${sk}"/>${hairTop}${face}</g>`;
  };

  const makeArt = (mode, kind, o, seed) => {
    if (mode === 'text') return null;
    const u = nid(), h = hash(seed), bp = BP[h % 6], dk = DK[h % 6];
    const clip = `<defs><clipPath id="${u}c"><circle cx="50" cy="50" r="50"/></clipPath></defs>`;
    if (kind === 'p') return svgEl('0 0 100 100', personInner(seed, mode));
    const ev = kind === 'e';
    const key = ev ? 'calendar' : (ICON_OF[o.id] || KIND_ICON[o.kind] || 'users');
    if (mode === 'photo') {
      const sc = ev ? (SCENE_OF[o.g] || 'campus') : (SCENE_OF[o.id] || KIND_SCENE[o.kind] || 'campus');
      const ov = ev ? '<rect width="200" height="100" fill="#000" opacity=".4"/>' : '';
      return svgEl('0 0 200 100', `<defs><clipPath id="${u}c"><circle cx="100" cy="50" r="50"/></clipPath></defs><g clip-path="url(#${u}c)">${SCN[sc](u)}${ov}</g>`);
    }
    if (mode === 'icon') return svgEl('0 0 100 100', `${clip}<g clip-path="url(#${u}c)"><rect width="100" height="100" fill="${dk}"/>${ev ? iconSvg(key, '#fff', 60, 20, 20, 0.3) : iconSvg(key, '#fff', 48, 26, 26, 1)}</g>`);
    return svgEl('0 0 100 100', `${clip}<g clip-path="url(#${u}c)"><rect width="100" height="100" fill="${bp[0]}"/>${ev ? iconSvg(key, dk, 60, 20, 20, 0.3) : `<circle cx="50" cy="50" r="30" fill="#fff" opacity=".85"/>${iconSvg(key, dk, 34, 33, 33, 1)}`}</g>`);
  };

  const coverArt = (mode, key, scene, o) => {
    const h = hash(o.id || o.title || o.label || 'x'), bp = BP[h % 6], dk = DK[h % 6];
    if (mode === 'photo') return sceneArt(scene);
    if (mode === 'icon') return svgEl('0 0 200 100', `<rect width="200" height="100" fill="${dk}"/><circle cx="170" cy="20" r="46" fill="#fff" opacity=".08"/><circle cx="24" cy="92" r="40" fill="#fff" opacity=".08"/>${iconSvg(key, '#fff', 52, 74, 24, 0.95)}`);
    if (mode === 'avatar') return svgEl('0 0 200 100', `<rect width="200" height="100" fill="${bp[0]}"/><circle cx="168" cy="22" r="40" fill="${bp[1]}" opacity=".5"/><circle cx="30" cy="90" r="34" fill="${bp[1]}" opacity=".4"/><circle cx="100" cy="50" r="32" fill="#fff" opacity=".9"/>${iconSvg(key, dk, 34, 83, 33, 1)}`);
    const label = String(o.short || o.label || o.title || '').replace(/[<>&]/g, '');
    return svgEl('0 0 200 100', `<rect width="200" height="100" fill="${bp[0]}"/><text x="100" y="64" text-anchor="middle" font-size="44" fill="${dk}" style="font-family:var(--font-heading)">${label}</text>`);
  };

  function build(s, ctx, comp) {
    R = ctx.React;
    const { PEOPLE, GROUPS, EVENTS, COL } = ctx;

    const T = (o, kind) => {
      if (!o || !(o.id || o.title || o.n || o.who)) return o;
      const out = { ...o };
      if (kind === 'p') {
        const me = o.id === 'me' || o.who === '정우진';
        const pp = PEOPLE.find((x) => x.id === o.id);
        const nm = me ? 'me' + s.meVar : pp ? pp.n : (o.n || o.who || o.title || o.id);
        const mode = s.thm[me ? 'me' : 'member'];
        if (mode !== 'text') {
          out.i = makeArt(mode, 'p', o, nm);
          if (o.via) out.viaI = makeArt(mode, 'p', o, o.via);
        }
      } else if (kind === 'g') {
        const mode = s.thm.group;
        const key = ICON_OF[o.id] || KIND_ICON[o.kind] || 'users';
        const scene = SCENE_OF[o.id] || KIND_SCENE[o.kind] || 'campus';
        if (mode !== 'text') { const el = makeArt(mode, 'g', o, o.id); out.short = el; out.i = el; }
        out.cover = coverArt(mode, key, scene, o);
      } else if (kind === 'e') {
        const mode = s.thm.event;
        const scene = SCENE_OF[o.g] || 'campus';
        if (mode === 'text') { out.thumb = null; out.tc = o.fg; out.ts = 'none'; out.hasCover = false; }
        else {
          out.thumb = makeArt(mode, 'e', o, o.id);
          out.tc = mode === 'avatar' ? '#2B2118' : '#fff';
          out.ts = mode === 'photo' ? '0 1px 3px rgba(0,0,0,.6)' : 'none';
          out.hasCover = true;
          out.cover = coverArt(mode, 'calendar', scene, o);
        }
      }
      return out;
    };

    const MODES = [['text', '텍스트'], ['icon', '아이콘'], ['avatar', '아바타'], ['photo', '이미지']];
    const sc = s.styScope;
    const SMP = {
      me: ['p', {}, 'me' + s.meVar, '우', 'AC'],
      member: ['p', {}, '이서연', '서', 'S4'],
      group: ['g', GROUPS[0], 'g1', '08', 'AC'],
      event: ['e', EVENTS[0], 'e1', '21', 'S']
    }[sc];
    const cur = s.thm[sc];
    const HINT = {
      me: '내 프로필 사진이에요. 홈 카드와 내가 쓴 글에 보여요.',
      member: '다른 회원의 썸네일이에요. 찾기, 멤버 목록, 소식, 프로필에 보여요.',
      group: '소속의 대표 썸네일과 대문 이미지에 적용돼요.',
      event: '모임 목록의 날짜 썸네일과 모임 상세 배너에 적용돼요.'
    }[sc];
    const sty = {
      hint: HINT,
      scopes: [['me', '내 프로필'], ['member', '회원'], ['group', '소속'], ['event', '모임']].map(([k, l]) => ({
        l, bg: sc === k ? 'var(--color-text)' : 'var(--color-neutral-100)', fg: sc === k ? 'var(--color-bg)' : 'var(--color-text)',
        go: () => comp.setState({ styScope: k })
      })),
      modes: MODES.map(([m, l]) => ({
        l, on: cur === m,
        el: m === 'text' ? SMP[3] : makeArt(m, SMP[0], SMP[1], SMP[2]),
        bg: m === 'text' ? COL[SMP[4]][0] : 'var(--color-neutral-100)',
        fg: m === 'text' ? COL[SMP[4]][1] : 'var(--color-text)',
        bd: cur === m ? 'var(--color-accent)' : 'var(--color-divider)',
        go: () => comp.setState((st) => ({ thm: { ...st.thm, [sc]: m } }))
      })),
      showVar: sc === 'me' && cur !== 'text',
      vars: [0, 1, 2, 3, 4, 5].map((k) => ({
        el: makeArt(cur === 'text' ? 'avatar' : cur, 'p', {}, 'me' + k),
        bd: s.meVar === k ? 'var(--color-accent)' : 'transparent',
        go: () => comp.setState({ meVar: k })
      }))
    };
    return { T, sty };
  }

  window.THUMB = { build, sceneArt, productArt, POST_SCENE, SCENE_OF, makeArt, personInner, iconSvg, ICO, DK, hash, nid };
})();

</script>
<script>
/* Membership Prototype: 연결망(관계 거미줄) view, 위치 기반 지도 찾기, 광고 슬롯.
   All data is fictional demo data. Rendered with React elements so taps, drags and glides work. */
(function () {
  const TH = window.THUMB;
  let R = null;
  const h = (...a) => R.createElement(...a);

  /* ---------------------------------------------------------------- graph */
  const P = {
    u1: { n: '이서연', r: '프로덕트 디자이너' }, u2: { n: '한도윤', r: '백엔드 개발자' }, u3: { n: '오하린', r: 'UX 리서처' },
    u4: { n: '윤재민', r: 'CTO' }, u5: { n: '정소희', r: '브랜드 디자이너' }, u6: { n: '강태오', r: '투자심사역' },
    u7: { n: '문유나', r: '셰프' }, u8: { n: '서지후', r: '변호사' },
    mj: { n: '김민지', r: '경영 08 총무' }, jh: { n: '박준호', r: '러닝크루 운영진' }, de: { n: '최다은', r: '카페 운영' },
    ga: { n: '임가온', r: '데이터 분석가' }, hj: { n: '송하준', r: '대학원생' }, ny: { n: '권나연', r: '편집자' },
    dh: { n: '배도현', r: '요리사' }, es: { n: '노은서', r: '서퍼·사진가' }, ji: { n: '한지우', r: '해양생물학자' }
  };
  const GRP = {
    g1: { n: '경영 08', ic: 'grad', mine: true }, g2: { n: '러닝크루', ic: 'run', mine: true },
    g3: { n: 'IT 동문', ic: 'code', mine: true }, g4: { n: '필름사진', ic: 'camera', mine: true },
    g5: { n: '한결 스터디', ic: 'book' }, g6: { n: '비공개 모임', ic: 'lock', priv: true },
    g7: { n: '성수 보드게임', ic: 'users' }, g8: { n: '부산 러닝', ic: 'run' }, g9: { n: '제주 서핑', ic: 'mountain' }
  };
  const MEM = {
    g1: ['me', 'mj', 'de', 'u1', 'u2', 'u6', 'u8'], g2: ['me', 'jh', 'u1', 'u3', 'u7'], g3: ['me', 'u2', 'u4'], g4: ['me', 'u5', 'de'],
    g5: ['u4', 'u8', 'ga', 'hj'], g6: ['hj', 'ny', 'u3'], g7: ['u5', 'ny', 'dh'], g8: ['u7', 'dh', 'es'], g9: ['es', 'ji']
  };
  const adj = {};
  const link = (a, b) => { (adj[a] = adj[a] || []).push(b); (adj[b] = adj[b] || []).push(a); };
  Object.keys(MEM).forEach((g) => MEM[g].forEach((p) => link(g, p)));
  const dist = { me: 0 }, par = {};
  (() => { const q = ['me']; while (q.length) { const x = q.shift(); (adj[x] || []).forEach((y) => { if (dist[y] == null) { dist[y] = dist[x] + 1; par[y] = x; q.push(y); } }); } })();
  const pathTo = (id) => { const out = []; let c = id; while (c) { out.unshift(c); c = par[c]; } return out; };
  const stepsOf = (id) => (GRP[id] ? (dist[id] - 1) / 2 : dist[id] / 2);
  const mask = (n) => n.charAt(0) + '○○';
  const ORDER = {}; Object.keys(adj).forEach((k, i) => { ORDER[k] = i; });
  const PEOPLE_IDS = Object.keys(P);
  const STATS = {
    direct: PEOPLE_IDS.filter((id) => stepsOf(id) <= 1).length,
    total: PEOPLE_IDS.length,
    max: Math.max(...PEOPLE_IDS.map(stepsOf)),
    groups: Object.keys(GRP).filter((g) => GRP[g].mine).length
  };

  let UNL = {};
  const label = (id, priv) => {
    if (id === 'me') return '나';
    if (UNL[id] && P[id]) return P[id].n;
    if (GRP[id]) { const g = GRP[id]; if (g.mine) return g.n; if (priv === 'strict') return '다른 모임'; return g.priv ? '비공개 모임' : g.n; }
    const st = stepsOf(id), n = P[id].n;
    if (st <= 1) return n;
    if (priv === 'strict') return '누군가';
    return st === 2 ? mask(n) : '누군가';
  };

  /* ---------------------------------------------------------------- icons */
  const ICO2 = {
    lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    coffee: '<path d="M10 2v2M14 2v2M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>'
  };
  const iconG = (key, color, size, x, y, op) =>
    `<g transform="translate(${x} ${y}) scale(${size / 24})" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="${op == null ? 1 : op}">${TH.ICO[key] || ICO2[key] || ''}</g>`;

  /* ---------------------------------------------------------------- layout */
  const W = 360, H = 440, CX = 180, CY = 220, R1 = 98, R2 = 158;
  function layout(focus, backId, backAngle) {
    const ns = (adj[focus] || []).slice().sort();
    const n = ns.length || 1;
    const hasBack = backId && ns.includes(backId);
    const base = hasBack ? backAngle : -Math.PI / 2;
    const order = hasBack ? [backId, ...ns.filter((x) => x !== backId)] : ns;
    const pos = {}, edges = [];
    pos[focus] = { x: CX, y: CY, a: 0, ring: 0 };
    order.forEach((id, k) => {
      const a = base + (k * 2 * Math.PI) / n;
      pos[id] = { x: CX + R1 * Math.cos(a), y: CY + R1 * Math.sin(a), a, ring: 1 };
      edges.push({ a: focus, b: id, ring: 1 });
    });
    order.forEach((id) => {
      let placed = 0;
      (adj[id] || []).filter((x) => x !== focus).forEach((x) => {
        if (pos[x]) { edges.push({ a: id, b: x, ring: 2 }); return; }
        if (placed >= 3) return;
        placed++;
        const a = pos[id].a + (placed - 2) * 0.36;
        const rr = R2 + (placed % 2) * 8;
        pos[x] = { x: CX + rr * Math.cos(a), y: CY + rr * Math.sin(a), a, ring: 2, via: id };
        edges.push({ a: id, b: x, ring: 2 });
      });
    });
    return { pos, edges };
  }

  /* ---------------------------------------------------------------- actions */
  const clearTimers = (comp) => { (comp._wt || []).forEach(clearTimeout); comp._wt = []; };
  function travel(comp, id) {
    const s = comp.state;
    const L = layout(s.webFocus, s.webBackId, s.webBack);
    const p = L.pos[id];
    const trail = s.webTrail;
    const idx = trail.indexOf(id);
    comp.setState({
      webFocus: id, webBackId: s.webFocus, webBack: (p ? p.a : 0) + Math.PI,
      webTrail: idx >= 0 ? trail.slice(0, idx + 1) : [...trail, id]
    });
    comp._pan = { x: 0, y: 0 };
    if (comp._vp) { comp._vp.style.transition = 'transform .6s'; comp._vp.style.transform = 'translate(0px,0px)'; }
    setTimeout(() => { try { const el = document.getElementById('wtrail'); if (el) el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' }); } catch (_) { /* ignore */ } }, 140);
  }
  function demo(comp) {
    clearTimers(comp);
    comp._pan = { x: 0, y: 0 };
    comp.setState({ webFocus: 'me', webBackId: null, webBack: -Math.PI / 2, webTrail: ['me'] });
    comp._wt.push(setTimeout(() => play(comp, pathTo('ji').slice(1)), 700));
  }
  function play(comp, path) {
    comp._wt = comp._wt || [];
    path.forEach((id, i) => comp._wt.push(setTimeout(() => travel(comp, id), i * 850)));
  }
  function open(comp, target) {
    clearTimers(comp);
    comp._pan = { x: 0, y: 0 };
    comp.setState((st) => ({ stack: [...st.stack, { v: 'web' }], sheet: null, webFocus: 'me', webBackId: null, webBack: -Math.PI / 2, webTrail: ['me'] }));
    if (target) comp._wt.push(setTimeout(() => play(comp, pathTo(target).slice(1)), 1000));
  }
  function tap(comp, id, via) {
    if (comp._dragMoved) return;
    clearTimers(comp);
    const f = comp.state.webFocus;
    if (id === f) return;
    if (via && via !== f) { travel(comp, via); comp._wt.push(setTimeout(() => travel(comp, id), 850)); } else travel(comp, id);
  }
  function replay(comp) {
    clearTimers(comp);
    const target = comp.state.webFocus;
    if (target === 'me') return;
    comp._pan = { x: 0, y: 0 };
    comp.setState({ webFocus: 'me', webBackId: null, webBack: -Math.PI / 2, webTrail: ['me'] });
    comp._wt.push(setTimeout(() => play(comp, pathTo(target).slice(1)), 800));
  }

  /* ---------------------------------------------------------------- web view */
  const bgInner = (u) =>
    `<defs><radialGradient id="${u}b" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#3A2C20"/><stop offset="1" stop-color="#17120E"/></radialGradient></defs>` +
    `<rect width="${W}" height="${H}" fill="url(#${u}b)"/>` +

  const rand = (n, alpha) => { const a = new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a).map((x) => alpha[x % alpha.length]).join(''); };
  const ALPHA = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const fmt = (iso) => { const d = new Date(iso); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const windowState = () => { const n = Date.now(); if (n < Date.parse(CFG.from)) return 'early'; if (n > Date.parse(CFG.to)) return 'late'; return 'ok'; };
  const store = { get() { try { return JSON.parse(sessionStorage.getItem('cosmos-gate')); } catch (_) { return null; } }, set(v) { try { sessionStorage.setItem('cosmos-gate', JSON.stringify(v)); } catch (_) { /* ignore */ } }, del() { try { sessionStorage.removeItem('cosmos-gate'); } catch (_) { /* ignore */ } } };
  const admitToken = (t) => { if (!t) return null; if (t.r === 'admin' && t.h === CFG.admin) return { ok: true, role: 'admin' }; if (t.r === 'user' && t.h === CFG.user && windowState() === 'ok') return { ok: true, role: 'user' }; return null; };

  const card = { padding: '16px', borderRadius: 24, background: 'var(--color-neutral-100)' };
  const lab = { fontSize: 12, fontWeight: 700, margin: '14px 0 6px' };
  const chipSt = (on) => ({ padding: '8px 14px', borderRadius: 999, cursor: 'pointer', font: '600 13px var(--font-body)', border: '1px solid ' + (on ? 'transparent' : 'var(--color-divider)'), background: on ? 'var(--color-accent)' : 'transparent', color: on ? 'var(--color-bg)' : 'var(--color-text)' });

  function Admin({ onClose, onApplied }) {
    const [userPw, setUserPw] = React.useState('');
    const [adminPw, setAdminPw] = React.useState('');
    const [preset, setPreset] = React.useState('1w');
    const [token, setToken] = React.useState('');
    const [busy, setBusy] = React.useState(false);
    const [msg, setMsg] = React.useState('');
    const [out, setOut] = React.useState('');
    const presets = [['1d', '1일'], ['1w', '1주'], ['1m', '1달']];

    const save = async () => {
      if (busy) return;
      if (userPw.length < 8) { setMsg('접속 비밀번호는 8자 이상으로 정해 주세요.'); return; }
      if (adminPw && adminPw.length < 10) { setMsg('관리자 비밀번호는 10자 이상으로 정해 주세요.'); return; }
      setBusy(true); setMsg(''); setOut('');
      try {
        const from = new Date(); const to = new Date(from);
        if (preset === '1d') to.setDate(to.getDate() + 1); else if (preset === '1w') to.setDate(to.getDate() + 7); else to.setMonth(to.getMonth() + 1);
        const userSalt = rand(16, '0123456789abcdef');
        const next = { v: 2, iter: 100000, userSalt, user: await derive(userPw, userSalt), adminSalt: CFG.adminSalt, admin: CFG.admin, from: from.toISOString(), to: to.toISOString() };
        if (adminPw) { next.adminSalt = rand(16, '0123456789abcdef'); next.admin = await derive(adminPw, next.adminSalt); }
        const text = 'window.__GATE = ' + JSON.stringify(next) + ';\n';
        if (!token) { setOut(text); setMsg('토큰이 없어서 파일 내용만 만들었어요. 아래 내용을 gate-config.js에 붙여 넣어 저장소에 올리면 적용돼요.'); setBusy(false); return; }
        const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
        const hd = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
        const cur = await fetch(url, { headers: hd });
        let sha; if (cur.ok) sha = (await cur.json()).sha; else if (cur.status !== 404) throw new Error('저장소를 읽지 못했어요 (' + cur.status + '). 토큰 권한을 확인해 주세요.');
        const put = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, hd), body: JSON.stringify({ message: 'update access settings', content: btoa(text), sha }) });
        if (!put.ok) throw new Error('저장하지 못했어요 (' + put.status + '). 토큰에 Contents 쓰기 권한이 있는지 확인해 주세요.');
        CFG = next; store.set({ r: 'admin', h: CFG.admin }); setToken(''); setUserPw(''); setAdminPw('');
        setMsg(`저장했어요. 1~2분 뒤 새 비밀번호가 적용돼요. 허용 기간: ${fmt(next.from)} ~ ${fmt(next.to)}`);
        onApplied();
      } catch (e) { setOut(''); setMsg(String(e.message || e)); }
      setBusy(false);
    };
    const inp = { type: 'text', className: 'input', autoComplete: 'off' };
    return h('div', { style: { position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(32,30,29,.55)', display: 'grid', placeItems: 'center', padding: 14, overflowY: 'auto' } },
      h('div', { role: 'dialog', 'aria-label': '관리자 설정', style: { width: 'min(440px,100%)', maxHeight: '94vh', overflowY: 'auto', padding: 22, borderRadius: 28, background: 'var(--color-bg)', boxShadow: 'var(--shadow-lg)' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } }, h('div', { style: { fontFamily: 'var(--font-heading)', fontSize: 22 } }, '접속 설정'), h('button', { className: 'btn btn-secondary', onClick: onClose, style: { padding: '6px 14px' } }, '닫기')),
        h('div', { style: { fontSize: 12, color: 'var(--color-neutral-700)', margin: '6px 0 4px', lineHeight: 1.5 } }, `지금 설정: ${fmt(CFG.from)} ~ ${fmt(CFG.to)}`),
        h('div', { style: lab }, '새 접속 비밀번호 (8자 이상)'),
        h('div', { style: { display: 'flex', gap: 6 } }, h('input', Object.assign({ value: userPw, 'aria-label': '새 접속 비밀번호', onChange: (e) => setUserPw(e.target.value), placeholder: '직접 입력하거나 생성' }, inp)), h('button', { className: 'btn btn-secondary', onClick: () => setUserPw(rand(10, ALPHA)), style: { flex: 'none', padding: '6px 14px' } }, '생성')),
        h('div', { style: lab }, '접속 허용 기간 (저장하는 순간부터 시작)'),
        h('div', { style: { display: 'flex', gap: 6 } }, ...presets.map(([v, l]) => h('button', { key: v, onClick: () => setPreset(v), 'aria-pressed': preset === v, style: chipSt(preset === v) }, l))),
        h('div', { style: lab }, '관리자 비밀번호 재설정 (바꿀 때만, 10자 이상)'),
        h('input', Object.assign({ value: adminPw, 'aria-label': '새 관리자 비밀번호', onChange: (e) => setAdminPw(e.target.value), placeholder: '비워 두면 그대로' }, inp)),
        h('div', { style: lab }, 'GitHub 토큰 (저장소에 바로 반영할 때)'),
        h('input', { type: 'password', className: 'input', autoComplete: 'off', value: token, 'aria-label': 'GitHub 토큰', onChange: (e) => setToken(e.target.value), placeholder: '비워 두면 파일 내용만 만들어요' }),
        h('div', { style: { fontSize: 11, color: 'var(--color-neutral-600)', marginTop: 6, lineHeight: 1.5 } }, '토큰은 이 브라우저 화면에만 있다가 저장 후 지워지고, 어디에도 보관되지 않아요.'),
        msg ? h('div', { role: 'status', style: Object.assign({}, card, { marginTop: 14, fontSize: 12.5, lineHeight: 1.55, fontWeight: 600 }) }, msg) : null,
        out ? h('textarea', { readOnly: true, className: 'input', value: out, onFocus: (e) => e.target.select(), style: { marginTop: 8, borderRadius: 16, fontSize: 11, minHeight: 110, fontFamily: 'ui-monospace,Menlo,monospace' } }) : null,
        h('button', { className: 'btn btn-primary btn-block', disabled: busy, onClick: save, style: { padding: '14px 0', fontSize: 15, marginTop: 14 } }, busy ? '저장 중…' : '저장하고 적용')));
  }

  function Gate({ tpl }) {
    const [role, setRole] = React.useState(null);
    const [pw, setPw] = React.useState('');
    const [msg, setMsg] = React.useState('');
    const [busy, setBusy] = React.useState(false);
    const [fails, setFails] = React.useState(0);
    const [panel, setPanel] = React.useState(false);
    const [, tick] = React.useState(0);

    React.useEffect(() => { const a = admitToken(store.get()); if (a) setRole(a.role); else store.del(); }, []);
    React.useEffect(() => {
      if (role !== 'user') return undefined;
      const id = setInterval(() => { if (windowState() !== 'ok') { store.del(); setRole(null); setMsg('시연 기간이 끝났어요.'); } }, 20000);
      return () => clearInterval(id);
    }, [role]);

    const submit = async (e) => {
      e.preventDefault();
      if (busy || !pw) return;
      setBusy(true);
      if (fails >= 5) await new Promise((r) => setTimeout(r, 4000));
      try {
        const ha = await derive(pw, CFG.adminSalt, CFG.iter);
        if (ha === CFG.admin) { store.set({ r: 'admin', h: ha }); setRole('admin'); setMsg(''); setPw(''); setBusy(false); return; }
        const hu = await derive(pw, CFG.userSalt, CFG.iter);
        if (hu === CFG.user) {
          const w = windowState();
          if (w === 'ok') { store.set({ r: 'user', h: hu }); setRole('user'); setMsg(''); setPw(''); }
          else if (w === 'early') setMsg(`아직 열리지 않았어요. ${fmt(CFG.from)} 부터 볼 수 있어요.`);
          else setMsg(`시연 기간이 끝났어요. (${fmt(CFG.to)} 까지)`);
        } else { setFails((n) => n + 1); setMsg('비밀번호가 맞지 않아요.'); }
      } catch (_) { setMsg('이 브라우저에서는 열 수 없어요. 다른 브라우저로 시도해 주세요.'); }
      setBusy(false);
    };

    if (role) {
      return h(Frag, null,
        h(Demo, { tpl }),
        role === 'admin' ? h('div', { style: { position: 'fixed', left: 12, bottom: 12, padding: '10px 12px', borderRadius: 16, background: '#2E2B25', color: '#F5EAD8', fontSize: 11, lineHeight: 1.5, zIndex: 50, maxWidth: 250 } },
          h('b', null, '관리자 모드'), h('br'), `허용 기간 ${fmt(CFG.from)} ~ ${fmt(CFG.to)}`, h('br'),
          h('button', { onClick: () => setPanel(true), style: { marginTop: 6, padding: '6px 12px', borderRadius: 999, border: 'none', background: '#C67139', color: '#F5EAD8', font: '600 12px var(--font-body)', cursor: 'pointer' } }, '접속 설정')) : null,
        panel ? h(Admin, { onClose: () => setPanel(false), onApplied: () => tick((x) => x + 1) }) : null);
    }
    return h('div', { style: { minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 20, background: 'var(--color-bg)' } },
      h('form', { onSubmit: submit, style: { width: 'min(380px,100%)', padding: '36px 28px', borderRadius: 32, background: 'var(--color-neutral-100)', boxShadow: 'var(--shadow-lg)', textAlign: 'center' } },
        h('div', { style: { fontFamily: 'var(--font-heading)', fontSize: 34, lineHeight: 1.1 } }, 'cosmos'),
        h('div', { style: { fontSize: 13, color: 'var(--color-neutral-700)', margin: '10px 0 22px', lineHeight: 1.6 } }, '흩어진 사람들이 링크로 이어져 하나의 우주가 되는 곳', h('br'), '데모 체험용 페이지예요. 전달받은 비밀번호를 입력해 주세요.'),
        h('input', { type: 'password', className: 'input', value: pw, autoComplete: 'off', 'aria-label': '비밀번호', placeholder: '비밀번호', onChange: (e) => setPw(e.target.value), style: { textAlign: 'center' } }),
        msg ? h('div', { role: 'alert', style: { marginTop: 12, fontSize: 12.5, color: 'var(--color-accent-700)', fontWeight: 600, lineHeight: 1.5 } }, msg) : null,
        h('button', { type: 'submit', className: 'btn btn-primary btn-block', disabled: busy || !pw, style: { padding: '13px 0', fontSize: 15 } }, busy ? '확인 중…' : '입장'),
        h('div', { style: { marginTop: 18, fontSize: 11, color: 'var(--color-neutral-600)', lineHeight: 1.5 } }, '이 화면은 예시 데이터로 구성된 시연 버전입니다.')));
  }

  /* ---------------------------------------------------------------- mount */
  function fit() {
    const s = Math.min(1, (window.innerHeight - 24) / 828, (window.innerWidth - 12) / 406);
    document.documentElement.style.setProperty('--ps', String(Math.max(0.4, s)));
  }
  fit(); window.addEventListener('resize', fit);
  const tpl = document.getElementById('dc-tpl').content;
  const root = ReactDOM.createRoot(document.getElementById('root'));
  const loadCfg = () => new Promise((res, rej) => { const el = document.createElement('script'); el.src = 'gate-config.js?t=' + Date.now(); el.onload = () => res(window.__GATE); el.onerror = rej; document.head.appendChild(el); });
  loadCfg().then((c) => { CFG = c; root.render(h(Gate, { tpl })); }).catch(() => {
    root.render(h('div', { style: { minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24, textAlign: 'center', color: 'var(--color-neutral-700)' } }, '설정 파일을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'));
  });
})();

</script>
</body>
</html>
